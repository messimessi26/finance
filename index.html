<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Finanças</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E5E9F0;--soft:#F1F4F9;--soft2:#F4F6FA;
  --blue:#2563EB;--blueText:#1D4ED8;--navy:#1E3A8A;--blue2:#3B82F6;--tint:#EFF6FF;--tint2:#DBEAFE;
  --green:#15803D;--greenBar:#16A34A;--orange:#C2410C;--orangeBar:#EA580C;--amberBg:#FEF3C7;--amberText:#92400E;
  --red:#DC2626;--grayBar:#CBD5E1;--shadow:0 1px 2px rgba(15,23,42,.08);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1120;--card:#141B2B;--text:#E6EAF2;--muted:#9AA6BA;--line:#263047;--soft:#1C2538;--soft2:#1A2234;
  --blue:#3B82F6;--blueText:#93C5FD;--navy:#1D4ED8;--blue2:#60A5FA;--tint:#1B2A48;--tint2:#1E3A8A;
  --green:#4ADE80;--greenBar:#22C55E;--orange:#FB923C;--orangeBar:#F97316;--amberBg:#3B2A10;--amberText:#FCD34D;
  --red:#EF4444;--grayBar:#475569;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B1120;--card:#141B2B;--text:#E6EAF2;--muted:#9AA6BA;--line:#263047;--soft:#1C2538;--soft2:#1A2234;
  --blue:#3B82F6;--blueText:#93C5FD;--navy:#1D4ED8;--blue2:#60A5FA;--tint:#1B2A48;--tint2:#1E3A8A;
  --green:#4ADE80;--greenBar:#22C55E;--orange:#FB923C;--orangeBar:#F97316;--amberBg:#3B2A10;--amberText:#FCD34D;
  --red:#EF4444;--grayBar:#475569;--shadow:none;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
img,svg{max-width:100%}
.app{display:flex;flex-wrap:wrap;gap:16px;padding:16px;min-height:100vh;align-items:stretch}
.side{flex:1 1 210px;max-width:100%;background:var(--card);border-radius:18px;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 20px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.small{font-size:11px;color:var(--muted)}
.navlabel{font-size:11px;color:var(--muted);padding:0 8px 6px}
.navlabel.gap{padding-top:18px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:13px;opacity:.85}
.nav a svg{stroke:var(--muted)}
.nav a[aria-current="page"]{background:var(--soft);font-weight:600;opacity:1}
.nav a[aria-current="page"] svg{stroke:var(--blue)}
.nav a:hover{background:var(--soft)}
.spacer{flex-grow:1;min-height:24px}
.theme{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:13px}
.seg{display:flex;gap:2px;background:var(--soft);border-radius:999px;padding:3px}
.seg button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:var(--shadow)}
.seg svg{stroke:var(--text)}
.who{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;margin-top:6px}
.top{background:var(--card);border-radius:18px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{stroke:var(--text)}
.month{font-size:22px;font-weight:700;letter-spacing:-.02em;padding:0 6px}
.month span{color:var(--muted);font-weight:500}
.bell{position:relative;width:40px;height:40px;border:1px solid var(--line);background:var(--card);border-radius:12px;display:flex;align-items:center;justify-content:center}
.bell svg{stroke:var(--text)}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.split{display:flex;border-radius:12px;background:var(--blue);position:relative}
.split button{border:0;background:transparent;color:#fff;font-size:13px;font-weight:600;height:40px}
.split .add{padding:0 16px}
.split .more{width:38px;border-left:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.menu{position:absolute;right:0;top:46px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:180px;box-shadow:0 8px 24px rgba(15,23,42,.15);display:none;z-index:10}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;color:var(--text);background:transparent;border-radius:8px;padding:10px 12px;font-weight:500;height:auto}
.menu button:hover{background:var(--soft)}

.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.s8{grid-column:span 8}.s4{grid-column:span 4}.s12{grid-column:span 12}
@media (max-width:1180px){.s8,.s4{grid-column:span 12}.dash .half{grid-column:span 6}}
@media (max-width:760px){.dash .half{grid-column:span 12}}
h2{margin:0;font-size:13px;font-weight:600}
h3{margin:0 0 8px;font-size:11px;font-weight:600}
.head{display:flex;justify-content:space-between;gap:12px}
.money{display:flex;align-items:baseline;gap:4px;letter-spacing:-.02em;white-space:nowrap}
.money .cur{font-size:20px;font-weight:700;color:var(--muted)}
.money .int{font-size:26px;font-weight:800}
.money .cents{font-size:12px;color:var(--muted)}
.money.big .cur{font-size:34px}.money.big .int{font-size:52px}.money.big .cents{font-size:18px;font-weight:500}
@media (max-width:520px){.money.big .int{font-size:40px}.money.big .cur{font-size:26px}}
.bar{display:flex;gap:3px;height:8px}
.bar div{border-radius:4px;min-width:3px}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:760px){.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.legend .v{font-size:13px;font-weight:700;margin-top:2px}
.legend .p{font-size:10px;font-weight:400;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.lbl{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.chips.scroll{display:flex;overflow-x:auto}
.chips.scroll button{flex:0 0 52px}
.chip{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.chip i{font-style:normal;font-size:7px;letter-spacing:1px;line-height:1;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.chip[aria-pressed="true"] i{color:#fff}
.chip.done{opacity:.55}
.list{list-style:none;margin:0;padding:0;font-size:12px}
.list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--soft)}
.list li:last-child{border-bottom:0}
.list .n{flex-grow:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .val{font-weight:600;white-space:nowrap}
.check{width:22px;height:22px;flex-shrink:0;border-radius:50%;padding:0;border:1.5px solid var(--muted);background:var(--card);display:flex;align-items:center;justify-content:center}
.check[aria-pressed="true"]{background:var(--greenBar);border-color:var(--greenBar)}
li.paid .n,li.paid .val{color:var(--muted);text-decoration:line-through}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:12px;font-weight:600;padding:9px 14px;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.foot{margin-top:auto;border-top:1px solid var(--soft);padding-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}
.comp{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.ccard{flex:0 0 84%;height:136px;border-radius:12px;color:#fff;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between}
.ccard.peek{flex:0 0 40%}
.ccard .t{font-size:12px;font-weight:700}
.ccard .k{font-size:9px;opacity:.85}
.ccard .b{font-size:11px;font-weight:600}
.pill{font-size:9px;font-weight:600;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:999px}
.chipgold{width:22px;height:17px;border-radius:4px;background:rgba(255,255,255,.6)}
.nexts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.nx{border-radius:12px;height:104px;position:relative;background:var(--soft2);text-align:center;overflow:hidden}
.nx.on{border:2px solid var(--blue);background:linear-gradient(180deg,var(--card) 50%,var(--tint) 50%)}
.nx .m{padding-top:10px;font-size:11px;font-weight:700}
.nx .pt{position:absolute;left:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--card);border:2px solid var(--muted)}
.nx.on .pt{border-color:var(--blue)}
.nx .vv{position:absolute;bottom:10px;width:100%;font-size:11px;font-weight:600;color:var(--muted)}
.nx.on .vv{color:var(--blueText);font-weight:700}
.track{position:relative;height:36px}
.track .rail{position:absolute;left:0;right:0;top:18px;height:12px;border-radius:4px;background:var(--soft);overflow:hidden}
.track .fill{height:100%}
.track .mark{position:absolute;top:12px;width:2px;height:24px;background:var(--text)}
.track .mk{position:absolute;top:0;transform:translateX(-50%);font-size:9px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
.item{display:flex;gap:8px;align-items:center;min-width:0}
.item .ic{width:28px;height:28px;border-radius:8px;background:var(--tint);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.item .ic svg{stroke:var(--blue)}
.item .nm{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .vl{font-size:11px;font-weight:700}
.empty{color:var(--muted);font-size:12px;padding:12px 0}
.warn{color:var(--orange)}.ok{color:var(--green)}

/* management screens */
.panel{background:var(--card);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.panel h1{margin:0;font-size:20px;letter-spacing:-.02em}
.panel p.intro{margin:0;color:var(--muted);font-size:13px;max-width:62ch;line-height:1.5}
.tablewrap{overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
td input[type=text],td select,.field input,.field select{width:100%;height:38px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 10px}
td input.num{text-align:right}
td.c{text-align:center}
td input[type=checkbox],.field input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}
.del{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.del svg{stroke:var(--muted)}
.del:hover{background:var(--soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600}
.field .hint{font-weight:400;color:var(--muted);font-size:11px}
.totals{display:flex;flex-wrap:wrap;gap:24px;font-size:12px;color:var(--muted)}
.totals b{display:block;color:var(--text);font-size:15px;margin-top:2px}
dialog{border:0;border-radius:18px;padding:0;background:var(--card);color:var(--text);width:min(440px,calc(100% - 32px));box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,42,.45)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:14px}
dialog .row{display:flex;gap:12px}
dialog .row>*{flex:1}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.welcome{background:var(--card);border-radius:18px;padding:32px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.welcome h1{margin:0;font-size:24px;letter-spacing:-.02em}
.welcome p{margin:0;color:var(--muted);max-width:56ch;line-height:1.5;font-size:14px}
.status{font-size:11px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toggle{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.toggle button{border:0;background:transparent;border-radius:8px;font-size:12px;font-weight:600;padding:8px 12px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:620px;height:auto}
.chartbox text{font-family:inherit;fill:var(--muted);font-size:11px}
.keys{display:flex;flex-wrap:wrap;gap:16px;font-size:11px;color:var(--muted)}
.keys span{display:flex;align-items:center;gap:6px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--soft2);border-radius:12px;padding:12px}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:700;margin-top:4px;white-space:nowrap}
.ftable{border-collapse:collapse;width:100%;min-width:640px;font-size:12px}
.ftable th,.ftable td{padding:9px 10px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap}
.ftable th:first-child,.ftable td:first-child{text-align:left}
.ftable thead th{font-size:11px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.ftable thead th.cur{color:var(--blueText)}
.ftable td.cur{background:var(--tint);font-weight:700}
.ftable td.est{color:var(--muted)}
.ftable tfoot td{font-weight:700;border-bottom:0}
.ftable tfoot tr.pct td{font-weight:400;color:var(--muted);font-size:11px}
.ftable input{width:110px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:0 8px;text-align:right}
.ftable input::placeholder{color:var(--muted);opacity:.8}
.cdot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.pos{color:var(--green)}.neg{color:var(--orange)}
details.tl summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--blueText);padding:4px 0}
/* reference backdrop: the app sits in a window over a dotted blue field */
html{background:#2350E0}
body{min-height:100vh;background:radial-gradient(rgba(255,255,255,.16) 1px,transparent 1.2px) 0 0/24px 24px,linear-gradient(160deg,#2D63F0 0%,#1F48D6 45%,#3A2E9E 100%);background-attachment:fixed;padding:40px 24px}
.app{max-width:1440px;margin:0 auto;background:var(--bg);border-radius:20px;box-shadow:0 30px 80px rgba(8,20,70,.45),0 0 0 1px rgba(255,255,255,.25);min-height:auto}
@media (max-width:760px){body{padding:0;background:var(--bg)}.app{border-radius:0;box-shadow:none;min-height:100vh}}
:root[data-theme="dark"] body{background:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px) 0 0/24px 24px,linear-gradient(160deg,#122a6b 0%,#0e1d4d 50%,#1d1650 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px) 0 0/24px 24px,linear-gradient(160deg,#122a6b 0%,#0e1d4d 50%,#1d1650 100%)}}
@media (max-width:760px){:root body,:root[data-theme="dark"] body{background:var(--bg)}}
.note{background:var(--card);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:12px;border:1px solid var(--tint2)}
.edit{color:var(--muted);display:inline-flex;vertical-align:-1px;margin-left:2px}
.split-bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:10px}
.split-bar div{display:flex;align-items:center;padding:0 8px;color:#fff;font-size:10px;font-weight:700}
.split-bar.cats{gap:2px;height:14px;margin-top:0}
.split-bar.cats div{padding:0;min-width:3px}
.round{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.round svg{stroke:var(--text)}.round:disabled{opacity:.4;cursor:default}
.cards-row{display:flex;gap:10px;margin-right:-20px;overflow:hidden}
.ccard .ctext{font-size:10px;font-weight:600;letter-spacing:.35em}
.ccard .k{font-size:8px;letter-spacing:.06em;opacity:.8}
.ccard .logo{display:inline-flex;align-self:flex-start;background:rgba(0,0,0,.18);border-radius:6px;padding:4px 6px;font-size:11px;font-weight:800}
.chipgold{background:linear-gradient(135deg,#e5e7eb,#9ca3af);position:relative}
.chipgold::after{content:"";position:absolute;inset:4px 5px;border:1px solid rgba(0,0,0,.25);border-radius:2px}
.caps{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.nexts{position:relative}
.nxline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.nx .pt{z-index:2}
.tag{display:inline-block;font-size:8px;font-weight:600;background:var(--tint2);color:var(--blueText);padding:2px 7px;border-radius:999px;margin-top:3px}
.tag.amber{font-size:9px;background:var(--amberBg);color:var(--amberText);border-radius:6px;padding:3px 7px;margin:0}
.toggle.full{display:grid;grid-template-columns:1fr 1fr}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Menu principal">
    <div class="brand"><div class="avatar">J</div><div><div style="font-weight:600;font-size:13px">Finanças do João</div><div class="small">Finanças pessoais</div></div></div>
    <div class="navlabel">Menu</div>
    <div class="nav">
      <a href="#visao" data-v="visao"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Visão geral</a>

/* ---------- importar extrato (CSV / OFX), lido só neste navegador ---------- */
function normDesc(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\d+/g,' ').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();}
function txCat(desc,valor){

  if(valor>0)return 'entrada';
  if(S.regras&&S.regras[k])return S.regras[k];

function decodeBuf(buf){try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){return new TextDecoder('windows-1252').decode(buf);}}
function parseAmt(s){s=String(s==null?'':s).replace(/R\$|\s|"/g,'');if(!s)return NaN;var neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(/D$/i.test(s)){neg=true;s=s.slice(0,-1);}else if(/C$/i.test(s))s=s.slice(0,-1);
  if(/^-/.test(s)){neg=!neg;s=s.slice(1);}if(/-$/.test(s)){neg=!neg;s=s.slice(0,-1);}
  var lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  var n=parseFloat(s);if(!isFinite(n))return NaN;n=Math.round(n*100)/100;return neg?-n:n;}
function parseDate(s){s=String(s||'').trim();var m=/^(\d{4})-?(\d{2})-?(\d{2})/.exec(s);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/.exec(s);if(m){var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');}return null;}
function parseOFX(t){
  var out=[],blocks=t.split(/<STMTTRN>/i).slice(1);
  blocks.forEach(function(b){b=b.split(/<\/STMTTRN>/i)[0];
    var g=function(tag){var r=new RegExp('<'+tag+'>([^<\\r\\n]*)','i').exec(b);return r?r[1].trim():'';};
    var dt=parseDate(g('DTPOSTED')),v=parseAmt(g('TRNAMT'));if(!dt||!isFinite(v))return;
    var memo=g('MEMO'),name=g('NAME');
    out.push({data:dt,desc:(memo&&name&&memo.indexOf(name)<0?name+' · '+memo:memo||name)||'Sem descrição',valor:v,fitid:g('FITID')});});
  return {rows:out,ofx:true};}
function splitCSV(line,d){var out=[],cur='',q=false;for(var i=0;i<line.length;i++){var ch=line[i];
  if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
  else if(ch==='"')q=true;else if(ch===d){out.push(cur);cur='';}else cur+=ch;}
  out.push(cur);return out.map(function(s){return s.trim();});}
function parseCSV(t){
  var lines=t.replace(/^﻿/,'').split(/\r?\n/).filter(function(l){return l.trim();});
  var hi=-1,d=';',col=null;
  for(var i=0;i<Math.min(lines.length,20)&&hi<0;i++){
    var dl=lines[i].split(';').length>=lines[i].split(',').length?';':',';
    var c=splitCSV(lines[i],dl).map(function(x){return normDesc(x.replace(/\d/g,''));});
    var di=c.findIndex(function(x){return /^(data|date|dt)/.test(x);});
    var vi=c.findIndex(function(x){return /valor|amount|value|quantia|montante/.test(x);});
    if(di>-1&&vi>-1){hi=i;d=dl;col={d:di,v:vi,s:c.findIndex(function(x,j){return j!==di&&j!==vi&&/descri|histor|lancamento|title|titulo|estabelec|memo|detalhe|identifica/.test(x);})};}
  }
  if(hi<0)return {err:'Não encontrei as colunas de data e valor neste CSV. Tente exportar em OFX.'};
  var out=[];
  for(var j=hi+1;j<lines.length;j++){var r=splitCSV(lines[j],d);var dt=parseDate(r[col.d]),v=parseAmt(r[col.v]);

async function importFiles(files){

    var file=files[f],txt;
    try{txt=decodeBuf(await file.arrayBuffer());}catch(e){erros.push(file.name+': não consegui ler');continue;}
    var res=/<OFX>|OFXHEADER/i.test(txt)?parseOFX(txt):parseCSV(txt);
    if(res.err){erros.push(file.name+': '+res.err);continue;}
    var rows=res.rows;
    if(!res.ofx){var neg=rows.filter(function(r){return r.valor<0;}).length,pos=rows.length-neg;
      var inv=ui.impMode==='cartao'||(ui.impMode==='auto'&&pos>neg);

}

function parse(s){s=String(s==null?'':s).replace(/R\$|\s/g,'');if(s.indexOf(',')>-1)s=s.replace(/\./g,'').replace(',','.');var n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:0;}
function moneyHtml(n,big){var parts=NF.format(Math.abs(n||0)).split(',');return '<div class="money'+(big?' big':'')+'"><span class="cur">'+(n<0?'−':'')+'R$</span><span class="int">'+parts[0]+'</span><span class="cents">,'+parts[1]+'</span></div>';}
function pct(x,t){return t>0?x/t*100:0;}
function p0(x){return Math.round(x)+'%';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function dd(d,ym){return String(d).padStart(2,'0')+'/'+String(ymParts(ym).m+1).padStart(2,'0');}

// Sempre guarda uma cópia neste navegador. Com login do Google, também salva no Firebase
// (users/<id>/apps/financas) e recebe na hora o que for alterado em outro aparelho.
var LS_KEY='minhas-financas-v1',APP_ID='financas';
function setStatus(t){var el=document.getElementById('status');if(el)el.textContent=t;}
function readLocal(){try{var raw=localStorage.getItem(LS_KEY);return raw?JSON.parse(raw):null;}catch(e){return null;}}
function writeLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function withTimeout(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'));},ms);Promise.resolve(p).then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
var cloud={uid:null,nome:'',unsub:null};
function renderAuth(){
  var b=document.getElementById('authBtn'),n=document.getElementById('whoName');if(!b)return;
  b.hidden=!window.FB;
  b.textContent=cloud.uid?'Sair da conta':'Entrar com Google para sincronizar';
  if(n)n.textContent=cloud.uid?(cloud.nome||'Você'):'João';
}
function parseRemote(snap){if(!snap.exists())return null;var d=snap.data()||{};try{return migrate(JSON.parse(d.estado));}catch(e){return null;}}
function initCloud(){
  if(!window.FB)return;renderAuth();
  FB.onUser(function(u){
    if(cloud.unsub){cloud.unsub();cloud.unsub=null;}
    cloud.uid=u?u.uid:null;cloud.nome=u?(u.displayName||u.email||''):'';renderAuth();
    if(!u){store={kind:'local'};setStatus('Salvo neste navegador');return;}
    setStatus('Conectando…');var first=true;
    cloud.unsub=FB.watch(u.uid,APP_ID,function(snap){
      if(snap.metadata.hasPendingWrites)return; // é a nossa própria gravação
      var remote=parseRemote(snap);
      if(first){first=false;store={kind:'cloud'};
        if(remote){S=remote;writeLocal();render();setStatus('Sincronizado');}
        else if(S&&!S.exemplo){flush();} // primeira vez: leva os dados deste navegador para a conta
        else setStatus('Sincronizado');
        return;}
      if(remote){S=remote;writeLocal();render();setStatus('Sincronizado');}
    },function(){store={kind:'local'};setStatus('Sem acesso à conta: salvo neste navegador');});
  });
}
var saveTimer=null,saving=false,pending=false;
function save(){writeLocal();clearTimeout(saveTimer);saveTimer=setTimeout(flush,600);}
async function flush(){
  if(store.kind!=='cloud'||!cloud.uid){setStatus(writeLocal()?'Salvo neste navegador':'Não foi possível salvar');return;}
  if(saving){pending=true;return;}
  saving=true;setStatus('Salvando…');
  try{await withTimeout(FB.save(cloud.uid,APP_ID,JSON.stringify(S)),15000);setStatus('Sincronizado');}
  catch(e){setStatus('Sem conexão: salvo neste navegador');}
  saving=false;if(pending){pending=false;flush();}
}
function commit(){save();render();}

// fatura of a card in a month: informed value, else repeats the last informed one (estimated)
function faturaOf(k,ym){
  if(k.faturas&&k.faturas[ym]!=null)return {v:k.faturas[ym],est:false};
  var keys=Object.keys(k.faturas||{}).filter(function(x){return x<ym;}).sort();
  if(!keys.length)return {v:0,est:false};
  return {v:k.faturas[keys[keys.length-1]],est:true};
}
function rendaTotal(){return S.salario+S.receitas.reduce(function(s,r){return s+r.valor;},0);}
function incomes(){var l=[];if(S.salario>0)l.push({id:'salario',nome:'Salário',valor:S.salario,dia:S.diaSalario||1});S.receitas.forEach(function(r){l.push({id:r.id,nome:r.nome,valor:r.valor,dia:r.dia});});return l;}
function billsOf(ym){
  var bills=S.contas.map(function(c){return {id:c.id,nome:c.nome,valor:c.valor,dia:c.dia,cat:c.cat,estimado:c.estimado};});
  S.cartoes.forEach(function(k){var f=faturaOf(k,ym);if(f.v>0)bills.push({id:'card-'+k.id,nome:'Fatura '+k.nome,valor:f.v,dia:k.dia,cat:'cartoes',card:true,estimado:f.est});});
  return bills;
}
function calc(ym){
  var bills=billsOf(ym),fixas=0,cart=0,mor=0,by={};
  bills.forEach(function(b){if(b.card)cart+=b.valor;else fixas+=b.valor;if(isMor(b.cat))mor+=b.valor;by[b.cat]=(by[b.cat]||0)+b.valor;});
  var cats=CATS.filter(function(x){return by[x.k]>0;}).map(function(x){return {k:x.k,n:x.n,c:x.c,v:by[x.k]};});
  if(S.diaADia>0)cats.push({k:DIA_CAT.k,n:DIA_CAT.n,c:DIA_CAT.c,v:S.diaADia});
  cats.sort(function(a,b){return b.v-a.v;});
  var sal=rendaTotal(),gastos=fixas+cart+S.diaADia;
  return {bills:bills,fixas:fixas,cart:cart,mor:mor,cats:cats,dia:S.diaADia,sal:sal,sobra:sal-gastos,gastos:gastos};
}
function paidMap(ym){ym=ym||ui.month;return S.pagas[ym]||(S.pagas[ym]={});}
function daysUntil(day){var p=ymParts(ui.month);var due=new Date(p.y,p.m,Math.min(day,dim(ui.month)));return Math.round((due-TODAY)/86400000);}
function whenText(d){if(d===0)return 'vence hoje';if(d===1)return 'vence amanhã';if(d>1)return 'em '+d+' dias';if(d===-1)return 'venceu ontem';return 'venceu há '+(-d)+' dias';}

// day-by-day cash for one month, starting from a balance
function daily(ym,start){
  var n=dim(ym),isCur=ym===TODAY_YM,first=isCur?TODAY.getDate():1;
  var paid=paidMap(ym),ev=[];
  incomes().forEach(function(r){var d=Math.min(r.dia,n);if(!isCur||d>first)ev.push({d:d,nome:r.nome,valor:r.valor});});
  billsOf(ym).forEach(function(b){var d=Math.min(b.dia,n);if(isCur){if(paid[b.id])return;if(d<first)d=first;}ev.push({d:d,nome:b.nome,valor:-b.valor,est:b.estimado});});
  ev.sort(function(a,b){return a.d-b.d||b.valor-a.valor;});
  var perDay=S.diaADia/n,bal=start,pts=[{d:first,bal:start,start:true}],rows=[],min={bal:start,d:first},ei=0;
  for(var d=first;d<=n;d++){
    while(ei<ev.length&&ev[ei].d===d){bal+=ev[ei].valor;rows.push({d:d,nome:ev[ei].nome,valor:ev[ei].valor,est:ev[ei].est,bal:bal});ei++;}
    bal-=perDay;pts.push({d:d,bal:bal});
    if(bal<min.bal)min={bal:bal,d:d};
  }
  return {pts:pts,rows:rows,start:start,end:bal,min:min,first:first,n:n,isCur:isCur,diaADia:perDay*(n-first+1)};
}
// month-by-month projection from today
function projection(count){
  var out=[],bal=S.saldoHoje||0;
  for(var i=0;i<count;i++){
    var ym=shiftYm(TODAY_YM,i),c=calc(ym),dy=daily(ym,bal);
    out.push({ym:ym,ent:c.sal,sai:c.gastos,start:bal,end:dy.end,min:dy.min});
    bal=dy.end;
  }
  return out;
}
function startOf(ym){if(ym<=TODAY_YM)return S.saldoHoje||0;var pr=projection(monthsBetween(TODAY_YM,ym)+1);return pr[pr.length-1].start;}
function monthsBetween(a,b){var x=ymParts(a),y=ymParts(b);return (y.y-x.y)*12+(y.m-x.m);}

function niceScale(lo,hi){if(lo===hi){lo-=1;hi+=1;}var span=hi-lo,step=Math.pow(10,Math.floor(Math.log10(span/4)));var err=span/4/step;step*=err>=5?10:err>=2.5?5:err>=1.5?2:1;return {lo:Math.floor(lo/step)*step,hi:Math.ceil(hi/step)*step,step:step};}
function yGrid(sc,Y,L,R){var g='';for(var v=sc.lo;v<=sc.hi+sc.step/2;v+=sc.step){var y=Y(v);g+='<line x1="'+L+'" x2="'+R+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="'+(Math.abs(v)<1e-9?1.5:1)+'"'+(Math.abs(v)<1e-9?'':' stroke-dasharray="3 4"')+'/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+shortBrl(v)+'</text>';}return g;}
function chartMonths(pr){
  var W=820,H=280,L=70,R=W-14,T=16,B=H-34;
  var vals=[0];pr.forEach(function(m){vals.push(m.ent,m.sai,m.end,-0);});
  var sc=niceScale(Math.min.apply(null,vals),Math.max.apply(null,vals));
  var Y=function(v){return T+(sc.hi-v)/(sc.hi-sc.lo)*(B-T);};
  var gw=(R-L)/pr.length,bw=Math.min(14,gw/4);
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projeção de 12 meses: entradas, saídas e saldo no fim de cada mês">'+yGrid(sc,Y,L,R);
  var line='';
  pr.forEach(function(m,i){
    var cx=L+gw*i+gw/2,on=m.ym===ui.month;
    if(on)s+='<rect x="'+(L+gw*i+2)+'" y="'+T+'" width="'+(gw-4)+'" height="'+(B-T)+'" rx="6" fill="var(--tint)"/>';
    s+='<rect x="'+(cx-bw-1)+'" y="'+Y(m.ent)+'" width="'+bw+'" height="'+Math.max(Y(0)-Y(m.ent),0)+'" rx="3" fill="var(--greenBar)"><title>'+mLabel(m.ym,true)+': entradas '+brl(m.ent)+'</title></rect>';
    s+='<rect x="'+(cx+1)+'" y="'+Y(m.sai)+'" width="'+bw+'" height="'+Math.max(Y(0)-Y(m.sai),0)+'" rx="3" fill="var(--blue2)"><title>'+mLabel(m.ym,true)+': saídas '+brl(m.sai)+'</title></rect>';
    line+=(i?'L':'M')+cx+' '+Y(m.end);
    s+='<text x="'+cx+'" y="'+(H-12)+'" text-anchor="middle" style="'+(on?'fill:var(--text);font-weight:700':'')+'">'+mLabel(m.ym,ymParts(m.ym).m===0||i===0)+'</text>';
  });
  s+='<path d="'+line+'" fill="none" stroke="var(--text)" stroke-width="2.5" stroke-linejoin="round"/>';
  pr.forEach(function(m,i){var cx=L+gw*i+gw/2;s+='<circle cx="'+cx+'" cy="'+Y(m.end)+'" r="4.5" fill="var(--card)" stroke="'+(m.end<0?'var(--orangeBar)':'var(--text)')+'" stroke-width="2.5"><title>'+mLabel(m.ym,true)+': saldo no fim do mês '+brl(m.end)+'</title></circle>';});
  return s+'</svg>';
}
function chartDays(dy,ym){
  var W=820,H=260,L=70,R=W-14,T=16,B=H-30;
  var vals=[0];dy.pts.forEach(function(p){vals.push(p.bal);});
  var sc=niceScale(Math.min.apply(null,vals),Math.max.apply(null,vals));
  var Y=function(v){return T+(sc.hi-v)/(sc.hi-sc.lo)*(B-T);};
  var span=Math.max(dy.n-dy.first+1,1),X=function(d,isStart){return L+((d-dy.first)+(isStart?0:1))/span*(R-L);};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Saldo dia a dia em '+MONTHS[ymParts(ym).m]+'">'+yGrid(sc,Y,L,R);
  var path='',area='';
  dy.pts.forEach(function(p,i){var x=X(p.d,p.start),y=Y(p.bal);path+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);});
  area=path+'L'+X(dy.n)+' '+Y(Math.max(sc.lo,0))+'L'+X(dy.first,true)+' '+Y(Math.max(sc.lo,0))+'Z';
  s+='<path d="'+area+'" fill="var(--tint)" opacity=".8"/><path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>';
  var shown={};
  dy.rows.forEach(function(r){var x=X(r.d),y=Y(r.bal);s+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="'+(r.valor>0?'var(--greenBar)':'var(--card)')+'" stroke="'+(r.valor>0?'var(--greenBar)':'var(--blue)')+'" stroke-width="2"><title>'+dd(r.d,ym)+': '+esc(r.nome)+' '+(r.valor>0?'+':'')+brl(r.valor)+' → saldo '+brl(r.bal)+'</title></circle>';});
  var step=span>20?5:span>10?2:1;
  for(var d=dy.first;d<=dy.n;d++){if((d-dy.first)%step===0||d===dy.n){if(shown[d])continue;shown[d]=1;s+='<text x="'+X(d,true)+'" y="'+(H-10)+'" text-anchor="middle">'+d+'</text>';}}
  var mx=X(dy.min.d),my=Y(dy.min.bal);
  s+='<circle cx="'+mx+'" cy="'+my+'" r="6" fill="none" stroke="'+(dy.min.bal<0?'var(--orangeBar)':'var(--text)')+'" stroke-width="2"/>';
  return s+'</svg>';
}

    ?'<div style="font-size:12px;font-weight:600" class="ok">↗ '+p0(sobraPct)+' do salário livre</div><div class="small" style="margin-top:2px">valor estimado após pagar todas as contas</div>'

  var destaques=S.contas.filter(function(x){return x.destaque&&x.destaque.trim();});

  '<section class="card s8" aria-labelledby="h-saldo"><div class="head"><div><h2 id="h-saldo" style="margin-bottom:16px">Saldo previsto</h2><div style="display:flex;flex-wrap:wrap;align-items:center;gap:18px">'+moneyHtml(c.sobra,true)+'<div style="border-left:1px solid var(--line);padding-left:14px">'+sobraLine+'</div></div></div>'+IL.wallet+'</div>'+
   '<div><div class="bar" role="img" aria-label="Para onde vai o salário">'+bar+'</div><div class="legend">'+
   '<div><div class="lbl">Salário</div><div class="v">'+brl(c.sal)+' <a href="#renda" class="edit" aria-label="Editar renda">'+PENCIL+'</a></div></div>'+

   '<div><div class="lbl"><span class="dot" style="background:var(--blue2)"></span>Cartões</div><div class="v">− '+brl(c.cart)+' <span class="p">· '+p0(pct(c.cart,c.sal))+'</span></div></div>'+

   '<div><div class="lbl"><span class="dot" style="background:var(--greenBar)"></span>= Sobra</div><div class="v '+(c.sobra>=0?'ok':'warn')+'">'+brl(c.sobra)+' <span class="p">· '+p0(sobraPct)+'</span></div></div>'+

   (ui.day!=null?'<div style="margin-top:12px">'+moneyHtml(dayTotal)+'</div><div class="small" style="margin-top:4px">'+whenText(daysUntil(ui.day))+' · '+dayPaid+' de '+dayBills.length+' paga'+(dayBills.length>1?'s':'')+'</div>':'')+

/* ---------- render ---------- */
function render(){
  var p=ymParts(ui.month);
  document.getElementById('monthTitle').innerHTML=MONTHS[p.m]+' <span>'+p.y+'</span>';
  document.querySelectorAll('.nav a').forEach(function(a){if(a.dataset.v===ui.view)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  var v=document.getElementById('view');
  if(!S){v.innerHTML='<div class="welcome"><p>Carregando seus dados…</p></div>';return;}
  v.innerHTML=ui.view==='contas'?viewContas():ui.view==='cartoes'?viewCartoes():ui.view==='renda'?viewRenda():ui.view==='extrato'?viewExtrato():viewVisao();
  var c=calc(ui.month),paid=paidMap();
  var n=c.bills.filter(function(b){var d=daysUntil(b.dia);return !paid[b.id]&&d<=7&&(ui.month===TODAY_YM||d>=0);}).length;
  var badge=document.getElementById('badge');badge.hidden=!n;badge.textContent=n;
  document.getElementById('bell').setAttribute('aria-label',n?n+' contas vencendo em até 7 dias':'Nenhuma conta vencendo em breve');
}

/* ---------- events ---------- */
function route(){var h=(location.hash||'').slice(1);ui.view=['visao','contas','cartoes','renda','extrato'].indexOf(h)>-1?h:'visao';render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
document.getElementById('prev').onclick=function(){ui.month=shiftYm(ui.month,-1);ui.day=null;render();};
document.getElementById('next').onclick=function(){ui.month=shiftYm(ui.month,1);ui.day=null;render();};
document.getElementById('bell').onclick=function(){if(!S)return;var c=calc(ui.month),paid=paidMap();var b=c.bills.filter(function(b){return !paid[b.id];}).sort(function(a,b){return a.dia-b.dia;})[0];if(b)ui.day=b.dia;location.hash='visao';render();};
var menu=document.getElementById('addMenu'),more=document.getElementById('moreBtn');
more.onclick=function(e){e.stopPropagation();var o=menu.classList.toggle('open');more.setAttribute('aria-expanded',o);};
document.addEventListener('click',function(){menu.classList.remove('open');more.setAttribute('aria-expanded','false');});
document.getElementById('addBtn').onclick=function(){openAdd('conta');};

function listFor(name){return name==='contas'?S.contas:name==='cartoes'||name==='faturas'?S.cartoes:name==='lanc'?S.lanc:S.receitas;}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-add],[data-day],[data-pay],[data-card],[data-del],[data-act],[data-theme-set],[data-chart],[data-mor],[data-catmode],[data-goto]');if(!t)return;
  if(t.dataset.themeSet){setTheme(t.dataset.themeSet);return;}
  if(!S)return;
  if(t.dataset.act==='importar'){var fi=document.getElementById('impFile');fi.value='';fi.click();return;}
  if(t.dataset.catmode){ui.catMode=t.dataset.catmode;render();var cb=document.querySelector('[data-catmode="'+ui.catMode+'"]');if(cb)cb.focus();return;}
  if(t.dataset.goto){ui.month=t.dataset.goto;ui.day=null;render();return;}
  if(t.dataset.act==='limparMes'){var nm=MONTHS[ymParts(ui.month).m].toLowerCase();if(confirm('Apagar os lançamentos importados de '+nm+'? As contas cadastradas não mudam.')){S.lanc=S.lanc.filter(function(x){return x.data.slice(0,7)!==ui.month;});ui.impMsg='';commit();}return;}
  if(t.dataset.add){openAdd(t.dataset.add);return;}
  if(t.dataset.chart){ui.chart=t.dataset.chart;render();var b=document.querySelector('[data-chart="'+ui.chart+'"]');if(b)b.focus();return;}
  if(t.dataset.mor){ui.morBase=t.dataset.mor;render();var mb=document.querySelector('[data-mor="'+ui.morBase+'"]');if(mb)mb.focus();return;}
  if(t.dataset.act==='manter'){S.exemplo=false;commit();return;}
  if(t.dataset.day){ui.day=+t.dataset.day;render();return;}
  if(t.dataset.pay){var m=paidMap();if(m[t.dataset.pay])delete m[t.dataset.pay];else m[t.dataset.pay]=true;commit();var pb=document.querySelector('[data-pay="'+t.dataset.pay+'"]');if(pb)pb.focus();return;}
  if(t.dataset.card){var n=S.cartoes.length;if(n)ui.card=(ui.card+(+t.dataset.card)+n)%n;render();return;}
  if(t.dataset.del){var id=t.closest('tr').dataset.id;var arr=t.dataset.del==='conta'?S.contas:t.dataset.del==='cartao'?S.cartoes:t.dataset.del==='lanc'?S.lanc:S.receitas;var it=arr.find(function(x){return x.id===id;});
    if(it&&confirm('Excluir “'+(it.nome||it.desc)+'”?')){arr.splice(arr.indexOf(it),1);commit();}return;}
  if(t.dataset.act==='exemplo'){S=example();commit();return;}
  if(t.dataset.act==='zerar'){if(S.exemplo||confirm('Apagar renda, saldo, contas, cartões e o histórico de pagamentos?')){S=empty();location.hash='visao';commit();}return;}
});
document.addEventListener('change',function(e){
  var t=e.target;if(!S)return;var fid=t.id;
  if(t.id==='impFile'){if(t.files&&t.files.length)importFiles(Array.prototype.slice.call(t.files));return;}
  if(t.dataset.impMode!=null){ui.impMode=t.value;return;}
  if(t.dataset.f==='cat'&&t.closest('[data-list="lanc"]')){
    // aprende: mesma descrição passa a usar esta categoria, agora e nos próximos extratos
    var tx=S.lanc.find(function(x){return x.id===t.closest('tr').dataset.id;});if(!tx)return;
    var key=normDesc(tx.desc),cnt=0;if(key)S.regras[key]=t.value;
    S.lanc.forEach(function(x){if(key&&x.valor<0&&normDesc(x.desc)===key){if(x.cat!==t.value&&x!==tx)cnt++;x.cat=t.value;}});
    ui.impMsg='Categoria salva.'+(cnt?' Também apliquei em '+cnt+' lançamento'+(cnt>1?'s':'')+' com a mesma descrição.':'');
    commit();refocus(fid);return;}
  if(t.dataset.s){var k=t.dataset.s;
    if(k==='refMoradia')S[k]=Math.max(1,Math.min(100,parseInt(t.value,10)||30));
    else if(k==='diaSalario')S[k]=Math.max(1,Math.min(31,parseInt(t.value,10)||1));
    else S[k]=parse(t.value);
    commit();refocus(fid,t);return;}
  var tr=t.closest('tr');if(!tr||!tr.parentNode.dataset.list)return;
  var list=listFor(tr.parentNode.dataset.list);var it=list.find(function(x){return x.id===tr.dataset.id;});if(!it)return;
  if(t.dataset.fm){it.faturas=it.faturas||{};if(String(t.value).trim()==='')delete it.faturas[t.dataset.fm];else it.faturas[t.dataset.fm]=parse(t.value);commit();refocus(fid,t);return;}
  if(t.dataset.f){var f=t.dataset.f,val;
    if(t.type==='checkbox')val=t.checked;
    else if(f==='dia')val=Math.max(1,Math.min(31,parseInt(t.value,10)||1));
    else if(f==='valor'||f==='limite')val=parse(t.value);
    else if(f==='destaque'||f==='detalhe'||f==='texto')val=t.value.trim();
    else val=t.value.trim()||it[f];
    it[f]=val;commit();refocus(fid,t);}
});
function refocus(fid){if(!fid)return;setTimeout(function(){var el=document.getElementById(fid);if(el&&(document.activeElement===document.body||!document.activeElement))el.focus();},0);}

/* ---------- add dialog ---------- */
var dlg=document.getElementById('dlg'),form=document.getElementById('dlgForm'),addKind='conta';
function openAdd(kind){
  if(!S)return;addKind=kind;
  var actions=function(label){return '<div class="actions"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn primary" value="ok">'+label+'</button></div>';};
  if(kind==='conta')form.innerHTML='<h2 style="font-size:16px">Nova conta</h2>'+
   '<label class="field">Nome<input type="text" name="nome" required placeholder="Ex.: Academia"></label>'+
   '<div class="row"><label class="field">Valor (R$)<input type="text" name="valor" inputmode="decimal" required placeholder="0,00"></label><label class="field">Vence dia<input type="text" name="dia" inputmode="numeric" required placeholder="5"></label></div>'+
   '<label class="field">Categoria<select name="cat">'+catOptions('outros')+'</select><span class="hint">Sugerida pelo nome; pode trocar</span></label>'+
   '<label class="chk"><input type="checkbox" name="estimado"> Valor estimado (muda todo mês)</label>'+actions('Adicionar conta');
  else if(kind==='cartao')form.innerHTML='<h2 style="font-size:16px">Novo cartão</h2>'+
   '<label class="field">Nome do cartão<input type="text" name="nome" required placeholder="Ex.: Nubank"></label>'+
   '<div class="row"><label class="field">Fatura de '+MONTHS[ymParts(ui.month).m].toLowerCase()+' (R$)<input type="text" name="fatura" inputmode="decimal" placeholder="0,00"></label><label class="field">Vence dia<input type="text" name="dia" inputmode="numeric" required placeholder="10"></label></div>'+
   '<label class="field">Limite livre (R$)<input type="text" name="limite" inputmode="decimal" placeholder="0,00"></label>'+
   '<label class="field">Cor<select name="cor">'+Object.keys(CARD_COLORS).map(function(k){return '<option value="'+k+'">'+k[0].toUpperCase()+k.slice(1)+'</option>';}).join('')+'</select></label>'+actions('Adicionar cartão');
  else form.innerHTML='<h2 style="font-size:16px">Nova receita mensal</h2>'+
   '<label class="field">Nome<input type="text" name="nome" required placeholder="Ex.: Freela"></label>'+
   '<div class="row"><label class="field">Valor (R$)<input type="text" name="valor" inputmode="decimal" required placeholder="0,00"></label><label class="field">Cai dia<input type="text" name="dia" inputmode="numeric" required placeholder="20"></label></div>'+actions('Adicionar receita');
  dlg.returnValue='';dlg.showModal();
}
// sugere a categoria enquanto digita o nome (até a pessoa escolher uma na mão)
form.addEventListener('input',function(e){
  if(addKind!=='conta'||e.target.name!=='nome')return;
  var sel=form.querySelector('select[name=cat]');if(!sel||sel.dataset.manual)return;
  sel.value=guessCat(e.target.value);
});
form.addEventListener('change',function(e){if(e.target.name==='cat')e.target.dataset.manual='1';});
dlg.addEventListener('close',function(){
  if(dlg.returnValue!=='ok')return;
  var fd=new FormData(form);var dia=Math.max(1,Math.min(31,parseInt(fd.get('dia'),10)||1));var nome=String(fd.get('nome')||'').trim()||'Sem nome';
  if(addKind==='conta'){S.contas.push({id:uid(),nome:nome,valor:parse(fd.get('valor')),dia:dia,cat:CAT_BY[fd.get('cat')]?fd.get('cat'):'outros',estimado:!!fd.get('estimado'),destaque:'',detalhe:''});ui.day=dia;}
  else if(addKind==='cartao'){var fat={};var fv=parse(fd.get('fatura'));if(fv)fat[ui.month]=fv;S.cartoes.push({id:uid(),nome:nome,texto:'',limite:parse(fd.get('limite')),dia:dia,cor:fd.get('cor'),faturas:fat});ui.card=S.cartoes.length-1;}
  else{S.receitas.push({id:uid(),nome:nome,valor:parse(fd.get('valor')),dia:dia});}
  dlg.returnValue='';commit();
});

/* ---------- theme ---------- */
function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('mf-theme',t);}catch(e){}markTheme();}
function markTheme(){var cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.querySelectorAll('[data-theme-set]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.themeSet===cur);});}
try{var th=localStorage.getItem('mf-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}
markTheme();

/* ---------- boot ---------- */
var local=null;try{local=migrate(readLocal());}catch(e){local=null;}
S=local||example();
route();
setStatus('Salvo neste navegador');
document.getElementById('authBtn').onclick=function(){
  if(!window.FB)return;
  if(cloud.uid){if(confirm('Sair da conta? Seus dados continuam salvos nela e uma cópia fica neste navegador.'))FB.signOut();return;}
  FB.signIn().catch(function(e){var c=e&&e.code||'';
    if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){alert('O navegador bloqueou a janela de login. Permita pop-ups para este site (ícone na barra de endereço) e clique de novo em "Entrar com Google".');return;}
    if(c==='auth/unauthorized-domain'){alert('Este endereço ainda não está liberado no Firebase (Authentication › Configurações › Domínios autorizados).');return;}
    alert('Não foi possível entrar ('+(c||'erro')+').');});
};
if(window.FB)initCloud();else window.addEventListener('fb-ready',initCloud);
})();
</script>
